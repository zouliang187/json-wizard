name: Download WARP
on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download WARP for macOS
        run: |
          set -e
          echo "Trying source 1: pkg.cloudflareclient.com"
          curl -L -o cloudflare_warp.pkg \
            "https://pkg.cloudflareclient.com/Cloudflare_WARP.pkg" \
            --connect-timeout 30 --max-time 180 -v 2>&1 | tail -10
          ls -lh cloudflare_warp.pkg
          
          # Verify it's a real pkg file (starts with xar)
          file cloudflare_warp.pkg
          head -c 4 cloudflare_warp.pkg | xxd

      - name: Upload WARP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-warp
          path: cloudflare_warp.pkg
          retention-days: 1
